# Publishes the two documentation sites with GitHub Pages.
# The sites are stored as zip archives; this unpacks them into one folder.
name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unpack the sites
        run: |
          mkdir _site
          for archive in *.zip; do unzip -q -o "$archive" -d _site; done
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -f _site/api-docs/index.html
          test -f _site/user-guide/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
